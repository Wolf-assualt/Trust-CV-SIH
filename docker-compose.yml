version: '3.8'

services:
  backend:
    build:
      context: ./Block-Sentinal
      dockerfile: Dockerfile
    container_name: trust-cv-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - DATA_DIR=/app/data
      - SQLITE_DB_PATH=/app/data/trust_cv.db
      - AIRGAP_MODE=true
    volumes:
      - sqlite_data:/app/data
    networks:
      - trust-cv-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/system/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: trust-cv-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - trust-cv-network

volumes:
  sqlite_data:
    driver: local
    name: trust_cv_sqlite_data

networks:
  trust-cv-network:
    driver: bridge
